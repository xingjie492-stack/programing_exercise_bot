{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>ユーザー一覧</h2>
</div>

<div class="table-responsive">
    <table class="table table-hover align-middle bg-white shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>ユーザー名</th>
                <th>Email</th>
                <th>権限</th>
                <th>登録日</th>
                <th class="text-center">操作</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.user_id }}</td>
                <td><strong>{{ user.user_name }}</strong></td>
                <td>{{ user.email }}</td>
                <td>
                    {% if user.is_admin %}
                        <span class="badge bg-info text-dark">管理者</span>
                    {% else %}
                        <span class="badge bg-secondary text-white">一般</span>
                    {% endif %}
                </td>
                <td>{{ user.sign_up_date }}</td>
                <td class="text-center">
                    <a href="{{ url_for('auth.update', user_id=user.user_id) }}" class="btn btn-sm btn-outline-primary">変更</a>
                    <a href="{{ url_for('auth.delete', user_id=user.user_id) }}" class="btn btn-sm btn-outline-danger">削除</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock content %}
