{% extends "base.html" %}
{% block header %}
    <head>
        <meta charset="UTF-8">
        <title>問題出題</title>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        
        <style>
            .problem-box {
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 8px;
                line-height: 1.6;
                background-color: #f9f9f9;
            }
            pre code { border-radius: 5px; }
        </style>
    </head>
{% endblock header %}

{% block content %}
    <h1>AIからのコーディング課題</h1>
        
        <div id="content" class="problem-box"></div>
        
        <script>
            // Pythonから渡された文字列をJavaScript変数に格納
            // |tojson はクォートなどを適切に処理するためのFlask/Jinja2フィルタです
            const rawMarkdown = {{ problem | tojson }};
            
            // MarkdownをHTMLに変換して流し込む
            document.getElementById('content').innerHTML = marked.parse(rawMarkdown);
            
            // コードブロックをハイライトする
            hljs.highlightAll();
        </script>

        <br>
        <a href="{{ url_for('presentation.presentation') }}">戻る</a>
{% endblock content %}
