{% extends "base.html" %}

{% block title %}お題選択 - プログラミングお題出してくれるくん{% endblock %}

{% block content %}
<div class="py-3">
    <h1 class="h3 mb-4 text-secondary">🎯 お題を生成する</h1>
    
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-4 border-bottom pb-2">出題設定</h5>
            <form action="{{ url_for('problem.generate_problem') }}" method="post">
                <div class="mb-3">
                    <label for="language" class="form-label fw-bold">出題言語を選択</label>
                    <select name="selected_language" id="language" class="form-select form-select-lg">
                        <option value="python">Python</option>
                        <option value="Java">Java</option>
                        <option value="C language">C言語</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="difficulty" class="form-label fw-bold">出題難易度を選択</label>
                    <select name="selected_difficulty" id="difficulty" class="form-select form-select-lg">
                        <option value="easy">かんたん</option>
                        <option value="normal">ふつう</option>
                        <option value="hard">むずい</option>
                    </select>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">問題を出す！</button>
                </div>
            </form>
        </div>
    </div>

    <div class="d-flex justify-content-end gap-2">
        <a href="{{ url_for('auth.update', user_id=current_user.user_id) }}" class="btn btn-outline-secondary btn-sm">ユーザー情報変更</a>
        <a href="{{ url_for('auth.delete', user_id=current_user.user_id) }}" class="btn btn-outline-danger btn-sm">アカウント削除</a>
    </div>
</div>
{% endblock content %}
