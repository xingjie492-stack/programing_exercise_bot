{% extends "base.html" %}

{% block content %}
<h1 class="h3 mb-4 text-success">📝 添削結果</h1>

<div id="review-content" class="p-4 mb-4 border rounded bg-white shadow"></div>

<div class="d-flex gap-2">
    <a href="{{ url_for('presentation.generate_problem') }}" class="btn btn-primary px-4">次の問題に挑戦！</a>
    <a href="{{ url_for('presentation.example_answer', user_id=submission.user_id, submission_id=submission.submission_id) }}" class="btn btn-outline-secondary">
        模範解答を確認
    </a>
</div>

<script>
    const rawMarkdown = {{ review | tojson }};
    document.getElementById('review-content').innerHTML = marked.parse(rawMarkdown);
    hljs.highlightAll();
</script>
{% endblock content %}
